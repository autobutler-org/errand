# Upstream gha-runner-scale-set values for the runner in
# charts/errand/ci/values.yaml, taken from autobutler-org/iac's
# arm-small-quark-backend with requests spelled out, and with the errand- names
# this chart gives the scale set and controller service account. make drift
# renders both and diffs.
githubConfigUrl: https://github.com/autobutler-org
githubConfigSecret: github-app-private-key
runnerScaleSetName: errand-arm-small-quark-backend
runnerGroup: errand
controllerServiceAccount:
  name: errand-controller
  namespace: ci-runners
minRunners: 0
maxRunners: 100
containerMode:
  type: dind
listenerTemplate:
  spec:
    containers:
      - name: listener
        image: ghcr.io/actions/gha-runner-scale-set-controller:0.15.1
    tolerations:
      - key: CriticalAddonsOnly
        operator: Equal
        value: "true"
        effect: NoSchedule
template:
  spec:
    resources:
      limits:
        cpu: 875m
        memory: 2.5Gi
      requests:
        cpu: 875m
        memory: 2.5Gi
    nodeSelector:
      kubernetes.io/arch: arm64
      ci.autobutler.org/runner: "true"
    tolerations:
      - key: ci.autobutler.org/runner
        operator: Equal
        value: "true"
        effect: NoSchedule
    volumes:
      - name: acr-login
        configMap:
          name: acr-login
          defaultMode: 0755
    containers:
      - name: runner
        image: autobutlerci.azurecr.io/quark/ci-backend:latest
        imagePullPolicy: Always
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RUNNER_HOOK_JOB_STARTED
            value: /home/runner/hooks/acr-login.sh
        volumeMounts:
          - name: acr-login
            mountPath: /home/runner/hooks
